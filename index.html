<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentTrace // Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-deep: #060a13;
            --bg-primary: #0b1120;
            --bg-panel: #111a2e;
            --bg-sidebar: #0d1425;
            --bg-hover: #162035;
            --accent-orange: #ff6b2b;
            --accent-amber: #f5a623;
            --accent-cyan: #22d3ee;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-purple: #a78bfa;
            --text-primary: #e2e8f0;
            --text-secondary: #8892a8;
            --text-dim: #3e4a63;
            --border: #1a2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Mono', monospace; background: var(--bg-deep); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Top Bar */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; height: 48px; background: var(--bg-primary);
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .topbar-left { display: flex; align-items: center; gap: 14px; }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; letter-spacing: 0.12em; }
        .logo span { color: var(--accent-orange); }
        .topbar-badge { padding: 2px 10px; border: 1px solid var(--border); font-size: 0.6rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
        .topbar-right { display: flex; align-items: center; gap: 18px; font-size: 0.7rem; color: var(--text-secondary); }
        .status-live { display: flex; align-items: center; gap: 6px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* Main Layout: Sidebar + Content */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 240px; flex-shrink: 0; background: var(--bg-sidebar);
            border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header { padding: 14px 16px 10px; font-size: 0.65rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .sidebar-list { flex: 1; overflow-y: auto; }
        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02);
            transition: background 0.15s; font-size: 0.8rem;
        }
        .sidebar-item:hover { background: var(--bg-hover); }
        .sidebar-item.active { background: var(--bg-hover); border-left: 3px solid var(--accent-orange); }
        .sidebar-item .name { color: var(--text-primary); }
        .sidebar-item .badge { font-size: 0.6rem; padding: 1px 6px; border-radius: 2px; }
        .badge-pass { color: var(--accent-green); border: 1px solid rgba(52,211,153,0.3); }
        .badge-iter { color: var(--accent-amber); border: 1px solid rgba(245,166,35,0.3); }
        .sidebar-summary { padding: 14px 16px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--text-dim); }

        /* Content Area */
        .content { flex: 1; overflow-y: auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }

        /* KPI Strip */
        .kpi-strip { display: flex; gap: 12px; flex-shrink: 0; }
        .kpi {
            flex: 1; background: var(--bg-panel); border: 1px solid var(--border);
            padding: 14px 16px; position: relative; min-width: 0;
        }
        .kpi-label { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
        .kpi-value { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--accent-orange); }
        .kpi-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 4px; }
        .kpi-spark { position: absolute; bottom: 8px; right: 12px; width: 60px; height: 24px; }

        /* Grid panels */
        .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .panel-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .panel {
            background: var(--bg-panel); border: 1px solid var(--border);
            padding: 14px; min-height: 0; position: relative; display: flex; flex-direction: column;
        }
        .panel-title {
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 500;
            color: var(--accent-amber); letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }
        .panel-title .tag { float: right; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--text-dim); }
        .chart-container { flex: 1; min-height: 220px; }

        /* Timeline (Gantt) */
        .gantt-panel { grid-column: 1 / -1; }
        .gantt-container { flex: 1; min-height: 160px; }

        /* Detail strip */
        .detail-strip {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        }
        .detail-card {
            background: var(--bg-primary); border: 1px solid var(--border); padding: 12px;
        }
        .detail-card .label { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
        .detail-card .value { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--accent-cyan); margin-top: 4px; }
        .detail-card .note { font-size: 0.65rem; color: var(--text-secondary); margin-top: 4px; }

        /* Comparison table */
        .comp-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .comp-table th { text-align: left; padding: 8px 12px; color: var(--accent-amber); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); background: rgba(245,166,35,0.03); }
        .comp-table td { padding: 8px 12px; color: var(--text-secondary); border-bottom: 1px solid rgba(255,255,255,0.02); }
        .comp-table .hl { color: var(--accent-orange); font-weight: 600; }
        .comp-table .ok { color: var(--accent-green); font-weight: 600; }

        /* Footer */
        .footer { padding: 10px 20px; text-align: center; font-size: 0.6rem; color: var(--text-dim); border-top: 1px solid var(--border); flex-shrink: 0; }
        .footer a { color: var(--accent-orange); text-decoration: none; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a3a5a; }

        /* Hardware Telemetry */
        .hw-status { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 8px; border: 1px solid var(--border); border-radius: 3px; transition: all 0.2s; }
        .hw-status:hover { border-color: var(--accent-amber); }
        .hw-status.connected { border-color: var(--accent-green); }
        .hw-status.connected .hw-dot { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .hw-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); transition: all 0.3s; }
        .hw-label { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; }
        .hw-section-title {
            font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 500;
            color: var(--accent-cyan); letter-spacing: 2px; text-transform: uppercase;
            padding: 4px 0; display: flex; align-items: center; gap: 10px;
        }
        .hw-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .hw-chart-container { flex: 1; min-height: 180px; }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="logo">AGENT<span>TRACE</span></div>
            <div class="topbar-badge">Infrastructure Profiler</div>
        </div>
        <div class="topbar-right">
            <span id="topbar-info">Loading...</span>
            <div class="hw-status" id="hw-status" onclick="toggleTelemetry()" title="Click to connect/disconnect hardware telemetry">
                <div class="hw-dot" id="hw-dot"></div>
                <span class="hw-label" id="hw-label">HW OFFLINE</span>
            </div>
            <div class="status-live"><div class="dot"></div> PROFILER ACTIVE</div>
        </div>
    </div>

    <div class="main">
        <!-- Sidebar: Design List -->
        <div class="sidebar">
            <div class="sidebar-header">Designs Profiled</div>
            <div class="sidebar-list" id="sidebar-list"></div>
            <div class="sidebar-summary" id="sidebar-summary"></div>
        </div>

        <!-- Content -->
        <div class="content" id="content">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="footer">
        AGENTTRACE v1.0 // Built by Ha Le // University of Central Florida //
        <a href="https://projectava.dev">Project Ava</a> //
        <a href="https://github.com/vanthienha199/agenttrace">GitHub</a>
    </div>

    <script>
    let DATA = null;
    let selectedDesign = null;
    let charts = {};

    async function init() {
        const resp = await fetch('agenttrace_report.json');
        DATA = await resp.json();
        renderSidebar();
        renderOverview();
        document.getElementById('topbar-info').textContent =
            `${DATA.summary.total_designs} DESIGNS // ${DATA.summary.total_tokens.toLocaleString()} TOKENS // $${DATA.summary.total_cost_usd} EST`;
    }

    function renderSidebar() {
        const list = document.getElementById('sidebar-list');
        const designs = DATA.time_decomposition;

        // "All Designs" overview item
        let html = `<div class="sidebar-item active" data-design="__overview__" onclick="selectDesign('__overview__', this)">
            <span class="name">All Designs</span>
            <span class="badge badge-pass">${DATA.summary.total_designs}</span>
        </div>`;

        designs.forEach(d => {
            const iters = d.iterations;
            const badge = iters > 1 ? `<span class="badge badge-iter">${iters}x</span>` : `<span class="badge badge-pass">1x</span>`;
            html += `<div class="sidebar-item" data-design="${d.design_name}" onclick="selectDesign('${d.design_name}', this)">
                <span class="name">${d.design_name.replace(/^\d+_/, '')}</span>
                ${badge}
            </div>`;
        });

        list.innerHTML = html;
        document.getElementById('sidebar-summary').textContent =
            `GPU: ${DATA.summary.avg_llm_pct}% // Idle: ${DATA.summary.avg_gpu_idle_pct}%`;
    }

    function selectDesign(name, el) {
        document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        selectedDesign = name;

        // Dispose old charts
        Object.values(charts).forEach(c => { try { c.dispose(); } catch(e) {} });
        charts = {};

        if (name === '__overview__') renderOverview();
        else renderDesignDetail(name);
    }

    // ─── OVERVIEW ─────────────────────────────────
    function renderOverview() {
        const s = DATA.summary;
        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="kpi-strip">
                <div class="kpi"><div class="kpi-label">GPU Time</div><div class="kpi-value">${s.avg_llm_pct}%</div><div class="kpi-sub">of wall clock (LLM inference)</div></div>
                <div class="kpi"><div class="kpi-label">GPU Idle</div><div class="kpi-value">${s.avg_gpu_idle_pct}%</div><div class="kpi-sub">during tool execution</div></div>
                <div class="kpi"><div class="kpi-label">Tokens</div><div class="kpi-value">${(s.total_tokens/1000).toFixed(0)}K</div><div class="kpi-sub">total consumed (est.)</div></div>
                <div class="kpi"><div class="kpi-label">Amplification</div><div class="kpi-value">${s.avg_iterations_per_design}x</div><div class="kpi-sub">avg iterations per design</div></div>
                <div class="kpi"><div class="kpi-label">First-Pass</div><div class="kpi-value">${s.first_pass_rate}%</div><div class="kpi-sub">success rate</div></div>
            </div>

            <div class="panel-grid">
                <div class="panel gantt-panel">
                    <div class="panel-title">Pipeline Activity Timeline <span class="tag">GPU (orange) vs CPU (cyan)</span></div>
                    <div class="gantt-container" id="chart-gantt"></div>
                </div>
            </div>

            <div class="panel-grid">
                <div class="panel">
                    <div class="panel-title">Time Decomposition <span class="tag">per design</span></div>
                    <div class="chart-container" id="chart-time"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">GPU Idle Analysis <span class="tag">Kim et al. range: 30-55%</span></div>
                    <div class="chart-container" id="chart-idle"></div>
                </div>
            </div>

            <div class="panel-grid">
                <div class="panel">
                    <div class="panel-title">Token Amplification <span class="tag">per design</span></div>
                    <div class="chart-container" id="chart-tokens"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">Failure Taxonomy <span class="tag">${Object.values(DATA.failure_distribution).reduce((a,b)=>a+b,0)} failures</span></div>
                    <div class="chart-container" id="chart-failures"></div>
                </div>
            </div>

            <div class="panel-grid">
                <div class="panel gantt-panel">
                    <div class="panel-title">Literature Validation <span class="tag">Kim et al. (HPCA 2026) + NanoFlow (OSDI 2025)</span></div>
                    <table class="comp-table">
                        <thead><tr><th>Metric</th><th>Published Finding</th><th>AgentTrace Measured</th><th>Status</th></tr></thead>
                        <tbody>
                            <tr><td>GPU idle during tool execution</td><td>30-55%</td><td class="hl">${s.avg_gpu_idle_pct}%</td><td class="ok">WITHIN RANGE</td></tr>
                            <tr><td>LLM call amplification</td><td>9.2x (Kim et al.)</td><td class="hl">${s.avg_iterations_per_design}x avg, up to 18x</td><td class="ok">CONSISTENT</td></tr>
                            <tr><td>CPU % of total latency</td><td>50-90%</td><td class="hl">${s.avg_gpu_idle_pct}% (sim + orchestration)</td><td class="ok">CONSISTENT</td></tr>
                            <tr><td>NanoFlow applicability</td><td>Overlap heterogeneous ops</td><td class="hl">LLM bursts + CPU gaps = overlappable</td><td class="ok">APPLICABLE</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Live Hardware Telemetry (Chopper Integration) -->
            <div class="hw-section-title" id="hw-section-title">LIVE HARDWARE TELEMETRY // CHOPPER</div>

            <div class="kpi-strip" id="hw-kpi-strip">
                <div class="kpi"><div class="kpi-label">Total Power</div><div class="kpi-value" id="hw-kpi-power" style="color:var(--accent-cyan)">--</div><div class="kpi-sub">watts (all GPUs)</div></div>
                <div class="kpi"><div class="kpi-label">Avg Temp</div><div class="kpi-value" id="hw-kpi-temp" style="color:var(--accent-cyan)">--</div><div class="kpi-sub">thermal spread: <span id="hw-kpi-spread">--</span></div></div>
                <div class="kpi"><div class="kpi-label">Straggler</div><div class="kpi-value" id="hw-kpi-straggler" style="color:var(--accent-red)">--</div><div class="kpi-sub">s-value: <span id="hw-kpi-sval">--</span></div></div>
                <div class="kpi"><div class="kpi-label">Lead GPU</div><div class="kpi-value" id="hw-kpi-lead" style="color:var(--accent-green)">--</div><div class="kpi-sub">fastest compute</div></div>
            </div>

            <div class="panel-grid three" id="hw-panels">
                <div class="panel">
                    <div class="panel-title">GPU Frequency <span class="tag" id="hw-freq-tag">awaiting connection</span></div>
                    <div class="hw-chart-container" id="chart-hw-freq"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">GPU Power <span class="tag" id="hw-power-tag">awaiting connection</span></div>
                    <div class="hw-chart-container" id="chart-hw-power"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">GPU Temperature <span class="tag" id="hw-temp-tag">awaiting connection</span></div>
                    <div class="hw-chart-container" id="chart-hw-temp"></div>
                </div>
            </div>

            <div class="panel-grid">
                <div class="panel">
                    <div class="panel-title">Straggler Detection <span class="tag">s-value per GPU (Lit Silicon)</span></div>
                    <div class="hw-chart-container" id="chart-hw-straggler"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">Agent Event Timeline <span class="tag" id="hw-agent-tag">LLM vs tool execution</span></div>
                    <div class="hw-chart-container" id="chart-hw-agent"></div>
                </div>
            </div>
        `;

        setTimeout(() => {
            renderGanttChart();
            renderTimeChart();
            renderIdleChart();
            renderTokenChart();
            renderFailureChart();
            initHardwareCharts();
        }, 50);
    }

    // ─── DESIGN DETAIL ────────────────────────────
    function renderDesignDetail(name) {
        const td = DATA.time_decomposition.find(d => d.design_name === name);
        const tk = DATA.token_amplification.find(d => d.design_name === name);
        const cv = DATA.convergence.find(d => d.design_name === name);
        const tl = DATA.timelines.find(d => d.design_name === name);
        if (!td) return;

        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="detail-strip">
                <div class="detail-card"><div class="label">Wall Time</div><div class="value">${(td.total_wall_ms/1000).toFixed(1)}s</div></div>
                <div class="detail-card"><div class="label">LLM Time</div><div class="value">${(td.llm_ms/1000).toFixed(1)}s</div><div class="note">${td.llm_pct}% of wall</div></div>
                <div class="detail-card"><div class="label">Sim Time</div><div class="value">${(td.sim_ms/1000).toFixed(1)}s</div><div class="note">${td.sim_pct}% of wall</div></div>
                <div class="detail-card"><div class="label">GPU Idle</div><div class="value">${td.gpu_idle_pct}%</div><div class="note">${td.iterations} iteration${td.iterations>1?'s':''}</div></div>
            </div>
            <div class="detail-strip">
                <div class="detail-card"><div class="label">Tokens In</div><div class="value">${tk.tokens_in.toLocaleString()}</div></div>
                <div class="detail-card"><div class="label">Tokens Out</div><div class="value">${tk.tokens_out.toLocaleString()}</div></div>
                <div class="detail-card"><div class="label">Amplification</div><div class="value">${tk.amplification_factor}x</div></div>
                <div class="detail-card"><div class="label">Est. Cost</div><div class="value">$${tk.cost_usd.toFixed(4)}</div></div>
            </div>

            <div class="panel-grid">
                <div class="panel gantt-panel">
                    <div class="panel-title">Pipeline Timeline <span class="tag">${name}</span></div>
                    <div class="gantt-container" id="chart-detail-gantt"></div>
                </div>
            </div>

            <div class="panel-grid">
                <div class="panel">
                    <div class="panel-title">Convergence Curve <span class="tag">pass count over iterations</span></div>
                    <div class="chart-container" id="chart-convergence"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">Per-Iteration Latency <span class="tag">LLM vs simulation</span></div>
                    <div class="chart-container" id="chart-iter-latency"></div>
                </div>
            </div>
        `;

        setTimeout(() => {
            renderDetailGantt(tl);
            if (cv) renderConvergenceChart(cv);
            if (cv) renderIterLatencyChart(cv);
        }, 50);
    }

    // ─── CHART: GANTT TIMELINE (OVERVIEW) ──────────
    function renderGanttChart() {
        const el = document.getElementById('chart-gantt');
        if (!el) return;
        const chart = echarts.init(el);
        charts['gantt'] = chart;

        // Top 8 multi-iteration designs for overview
        const tls = DATA.timelines
            .filter(t => t.timeline.length > 0)
            .sort((a, b) => b.total_duration_ms - a.total_duration_ms)
            .slice(0, 10);

        const categories = tls.map(t => t.design_name.replace(/^\d+_/, ''));
        const maxDur = Math.max(...tls.map(t => t.total_duration_ms));

        const gpuData = [];
        const cpuData = [];

        tls.forEach((t, yi) => {
            t.timeline.forEach(seg => {
                const arr = seg.type === 'llm_inference' ? gpuData : cpuData;
                arr.push({
                    name: seg.label,
                    value: [yi, seg.start, seg.start + seg.duration, seg.duration],
                    itemStyle: { color: seg.type === 'llm_inference' ? '#ff6b2b' : '#22d3ee' }
                });
            });
        });

        function renderItem(params, api) {
            const yi = api.value(0);
            const start = api.coord([api.value(1), yi]);
            const end = api.coord([api.value(2), yi]);
            const height = api.size([0, 1])[1] * 0.6;
            return { type: 'rect', shape: { x: start[0], y: start[1] - height/2, width: Math.max(end[0] - start[0], 2), height: height }, style: api.style() };
        }

        chart.setOption({
            tooltip: { formatter: p => `${p.data.name}<br/>${(p.data.value[3]/1000).toFixed(1)}s` },
            grid: { left: 120, right: 30, top: 10, bottom: 44 },
            xAxis: { type: 'value', max: maxDur, axisLabel: { formatter: v => (v/1000).toFixed(0)+'s', color: '#8892a8', fontSize: 10 }, splitLine: { lineStyle: { color: '#1a2540' } } },
            yAxis: { type: 'category', data: categories, inverse: true, axisLabel: { color: '#8892a8', fontSize: 11 }, axisTick: { show: false }, splitLine: { show: false } },
            series: [
                { type: 'custom', renderItem: renderItem, encode: { x: [1,2], y: 0 }, data: gpuData, name: 'GPU' },
                { type: 'custom', renderItem: renderItem, encode: { x: [1,2], y: 0 }, data: cpuData, name: 'CPU' },
            ],
            dataZoom: [{ type: 'slider', xAxisIndex: 0, bottom: 4, height: 20, borderColor: '#1a2540', backgroundColor: '#0b1120', fillerColor: 'rgba(255,107,43,0.1)', handleStyle: { color: '#ff6b2b' }, textStyle: { color: '#8892a8', fontSize: 10 } }],
        });
        chart.on('click', p => {
            if (p.data && p.data.value) {
                const idx = p.data.value[0];
                const name = tls[idx].design_name;
                const el = document.querySelector(`.sidebar-item[data-design="${name}"]`);
                if (el) selectDesign(name, el);
            }
        });
        window.addEventListener('resize', () => chart.resize());
    }

    // ─── CHART: TIME DECOMPOSITION (Dual-panel: % mix + absolute total) ────
    function renderTimeChart() {
        const el = document.getElementById('chart-time');
        if (!el) return;

    // ─── CHART: GPU IDLE (lollipop — selective labels to avoid collision) ─────
    function renderIdleChart() {
        const el = document.getElementById('chart-idle');
        if (!el) return;
        const chart = echarts.init(el);
        charts['idle'] = chart;

        const all = DATA.time_decomposition.filter(d => !d.design_name.includes('mux') && !d.design_name.includes('test_'));
        const hasData = all.filter(d => d.llm_ms > 0).sort((a,b) => a.gpu_idle_pct - b.gpu_idle_pct);
        const noData = all.filter(d => d.llm_ms === 0);
        const labels = hasData.map(x => x.design_name.replace(/^\d+_/, ''));
        const avgIdle = hasData.reduce((s, d) => s + d.gpu_idle_pct, 0) / hasData.length;

        // Only show labels where there's enough gap from the previous labeled value (>= 1.5pp)
        var lastLabeled = -999;
        var labelFlags = hasData.map(function(x) {
            // Always label the top 2 (outliers) and bottom 1
            var idx = hasData.indexOf(x);
            if (idx === 0 || idx >= hasData.length - 2) { lastLabeled = x.gpu_idle_pct; return true; }
            if (x.gpu_idle_pct - lastLabeled >= 1.5) { lastLabeled = x.gpu_idle_pct; return true; }
            return false;
        });

        chart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: '#2a3a5a' } }, formatter: function(params) {
                // Find the scatter series param (skip bar stem)
                var p = params.find(function(x) { return x.seriesType === 'scatter'; }) || params[0];
                var d = hasData[labels.indexOf(p.axisValueLabel)];
                return '<b>' + p.axisValueLabel + '</b><br/>GPU Idle: <span style="color:#ff6b2b;font-weight:bold">' + (d ? d.gpu_idle_pct : p.value) + '%</span><br/>Iterations: ' + (d ? d.iterations : '?') + '<br/>Wall time: ' + (d ? (d.total_wall_ms/1000).toFixed(1)+'s' : '?');

            yAxis: { type: 'category', data: labels, axisLabel: { color: '#8892a8', fontSize: 10 }, axisTick: { show: false }, axisLine: { lineStyle: { color: '#1a2540' } } },
            series: [
                // Thin stem (use custom renderItem to draw a plain line, not a bar with rounded caps)
                { type: 'custom', renderItem: function(params, api) {
                    var yVal = api.value(0);
                    var start = api.coord([0, yVal]);
                    var end = api.coord([api.value(1), yVal]);
                    return { type: 'line', shape: { x1: start[0], y1: start[1], x2: end[0], y2: end[1] }, style: { stroke: 'rgba(142,150,170,0.2)', lineWidth: 1.5 } };

                  data: hasData.map(function(x, i) { return [i, x.gpu_idle_pct]; }),

                },
                // Dot at value
                { type: 'scatter', data: hasData.map(function(x, i) {
                    return {
                        value: x.gpu_idle_pct,
                        itemStyle: { color: x.gpu_idle_pct > 30 ? '#f5a623' : '#34d399' },
                        label: { show: labelFlags[i], position: 'right', formatter: x.gpu_idle_pct.toFixed(1) + '%', color: '#8892a8', fontSize: 9, distance: 5 }
                    };
                  }),
                  symbolSize: 9, symbol: 'circle', z: 2,
                  markLine: { silent: true, symbol: 'none', data: [
                    { xAxis: 30, lineStyle: { color: '#f5a623', type: 'dashed', width: 1.5 }, label: { show: true, position: 'end', formatter: '30%', color: '#f5a623', fontSize: 10, fontWeight: 'bold' } },

    // ═══════════════════════════════════════════════
    // LIVE HARDWARE TELEMETRY (Chopper Integration)
    // ═══════════════════════════════════════════════
    const HW_URL = 'http://localhost:8765/stream/hardware';
    const AGENT_URL = 'http://localhost:8765/stream/agent';
    const MAX_HW_POINTS = 300; // 5 min at 1Hz
    let hwSource = null;
    let agentSource = null;
    let hwConnected = false;
    let hwCharts = { freq: null, power: null, temp: null, straggler: null, agent: null };
    let hwData = { timestamps: [], freq: {}, power: {}, temp: {}, svalues: {} };
    let agentEvents = []; // {elapsed, type, name}
    const GPU_COLORS = ['#ff6b2b','#22d3ee','#34d399','#f5a623','#a78bfa','#f87171','#60a5fa','#fbbf24'];

    function toggleTelemetry() {
        if (hwConnected) disconnectTelemetry();
        else connectTelemetry();
    }

    function connectTelemetry() {
        if (hwSource) hwSource.close();
        if (agentSource) agentSource.close();
        hwData = { timestamps: [], freq: {}, power: {}, temp: {}, svalues: {} };
        agentEvents = [];

        try {
            hwSource = new EventSource(HW_URL);
            hwSource.onopen = () => {
                hwConnected = true;
                document.getElementById('hw-status').classList.add('connected');
                document.getElementById('hw-label').textContent = 'HW LIVE';
            };
            hwSource.onmessage = (event) => {
                const d = JSON.parse(event.data);
                const t = d.elapsed ? d.elapsed.toFixed(0) + 's' : new Date(d.ts * 1000).toLocaleTimeString();

                hwData.timestamps.push(t);
                if (hwData.timestamps.length > MAX_HW_POINTS) hwData.timestamps.shift();

                d.gpus.forEach(g => {
                    const id = g.gpu;
                    if (!hwData.freq[id]) { hwData.freq[id] = []; hwData.power[id] = []; hwData.temp[id] = []; hwData.svalues[id] = []; }
                    hwData.freq[id].push(g.gfxclk);
                    hwData.power[id].push(g.power);
                    hwData.temp[id].push(g.temp);
                    if (hwData.freq[id].length > MAX_HW_POINTS) {
                        hwData.freq[id].shift(); hwData.power[id].shift(); hwData.temp[id].shift(); hwData.svalues[id].shift();
                    }
                });

                // Store straggler s-values
                if (d.straggler && d.straggler.s_values) {
                    Object.entries(d.straggler.s_values).forEach(([id, sv]) => {
                        if (!hwData.svalues[id]) hwData.svalues[id] = [];
                        hwData.svalues[id].push(sv);
                    });
                }

                updateHardwareCharts(d);
                updateStragglerKPIs(d);
            };
            hwSource.onerror = () => {
                hwConnected = false;
                document.getElementById('hw-status').classList.remove('connected');
                document.getElementById('hw-label').textContent = 'HW ERROR';
                hwSource.close();
                hwSource = null;
            };

            // Agent event stream
            agentSource = new EventSource(AGENT_URL);
            agentSource.onmessage = (event) => {
                const evt = JSON.parse(event.data);
                agentEvents.push(evt);
                if (agentEvents.length > 500) agentEvents.shift();
                updateAgentChart();
            };
        } catch (e) {
            console.error('Telemetry connection failed:', e);
        }
    }

    function disconnectTelemetry() {
        if (hwSource) { hwSource.close(); hwSource = null; }
        if (agentSource) { agentSource.close(); agentSource = null; }
        hwConnected = false;
        document.getElementById('hw-status').classList.remove('connected');
        document.getElementById('hw-label').textContent = 'HW OFFLINE';
    }

    function initHardwareCharts() {
        const freqEl = document.getElementById('chart-hw-freq');
        const powerEl = document.getElementById('chart-hw-power');
        const tempEl = document.getElementById('chart-hw-temp');
        const stragglerEl = document.getElementById('chart-hw-straggler');
        const agentEl = document.getElementById('chart-hw-agent');
        if (!freqEl) return;

        hwCharts.freq = echarts.init(freqEl);
        hwCharts.power = echarts.init(powerEl);
        hwCharts.temp = echarts.init(tempEl);
        if (stragglerEl) hwCharts.straggler = echarts.init(stragglerEl);
        if (agentEl) hwCharts.agent = echarts.init(agentEl);

        const baseOpt = (yName, yMin, yMax) => ({
            grid: { left: 55, right: 15, top: 10, bottom: 25 },
            xAxis: { type: 'category', data: [], axisLabel: { color: '#8892a8', fontSize: 9, interval: 29 }, axisLine: { lineStyle: { color: '#1a2540' } } },
            yAxis: { type: 'value', name: yName, nameTextStyle: { color: '#3e4a63', fontSize: 9 }, min: yMin, max: yMax, axisLabel: { color: '#8892a8', fontSize: 9 }, splitLine: { lineStyle: { color: '#1a2540' } } },
            series: [],
        });

        hwCharts.freq.setOption(baseOpt('MHz', 1000, 2200));
        hwCharts.power.setOption(baseOpt('W', 0, null));
        hwCharts.temp.setOption(baseOpt('\u00b0C', 30, 100));
        if (hwCharts.straggler) hwCharts.straggler.setOption(baseOpt('s-value', 0, null));
        if (hwCharts.agent) {
            hwCharts.agent.setOption({
                grid: { left: 55, right: 15, top: 10, bottom: 25 },
                xAxis: { type: 'value', name: 'elapsed (s)', nameTextStyle: { color: '#3e4a63', fontSize: 9 }, axisLabel: { color: '#8892a8', fontSize: 9 }, splitLine: { lineStyle: { color: '#1a2540' } } },
                yAxis: { type: 'category', data: ['Agent'], axisLabel: { show: false }, axisTick: { show: false } },
                series: [],
            });
        }

        window.addEventListener('resize', () => {
            Object.values(hwCharts).forEach(c => { if (c) c.resize(); });
        });
    }

    function updateHardwareCharts(d) {
        if (!hwCharts.freq) return;
        const gpuIds = Object.keys(hwData.freq).sort((a,b) => a - b);
        const src = d.source === 'amdsmi' ? 'AMD SMI' : 'mock';

        function makeSeries(metric) {
            return gpuIds.map((id, i) => ({
                name: 'GPU ' + id,
                type: 'line', smooth: true, showSymbol: false,
                data: hwData[metric][id],
                lineStyle: { width: 1.5, color: GPU_COLORS[i % GPU_COLORS.length] },
                itemStyle: { color: GPU_COLORS[i % GPU_COLORS.length] },
            }));
        }

        const tagSuffix = src + ' // ' + gpuIds.length + ' GPUs';
        const freqTag = document.getElementById('hw-freq-tag');
        const powerTag = document.getElementById('hw-power-tag');
        const tempTag = document.getElementById('hw-temp-tag');
        if (freqTag) freqTag.textContent = tagSuffix;
        if (powerTag) powerTag.textContent = tagSuffix;
        if (tempTag) tempTag.textContent = tagSuffix;

        hwCharts.freq.setOption({ xAxis: { data: hwData.timestamps }, series: makeSeries('freq') });
        hwCharts.power.setOption({ xAxis: { data: hwData.timestamps }, series: makeSeries('power') });
        hwCharts.temp.setOption({ xAxis: { data: hwData.timestamps }, series: makeSeries('temp') });

        // Update straggler chart
        if (hwCharts.straggler) {
            const svSeries = gpuIds.map((id, i) => ({
                name: 'GPU ' + id,
                type: 'line', smooth: true, showSymbol: false,
                data: hwData.svalues[id] || [],
                lineStyle: { width: 1.5, color: GPU_COLORS[i % GPU_COLORS.length] },
                itemStyle: { color: GPU_COLORS[i % GPU_COLORS.length] },
                areaStyle: { opacity: 0.05 },
            }));
            hwCharts.straggler.setOption({ xAxis: { data: hwData.timestamps }, series: svSeries });
        }
    }

    function updateStragglerKPIs(d) {
        const powerEl = document.getElementById('hw-kpi-power');
        const tempEl = document.getElementById('hw-kpi-temp');
        const spreadEl = document.getElementById('hw-kpi-spread');
        const stragglerEl = document.getElementById('hw-kpi-straggler');
        const svalEl = document.getElementById('hw-kpi-sval');
        const leadEl = document.getElementById('hw-kpi-lead');
        if (!powerEl) return;

        if (d.aggregate) {
            powerEl.textContent = d.aggregate.total_power + 'W';
            tempEl.textContent = d.aggregate.avg_temp + '\u00b0C';
            spreadEl.textContent = d.aggregate.temp_spread + '\u00b0C';
        }
        if (d.straggler) {
            stragglerEl.textContent = d.straggler.straggler_gpu !== null ? 'GPU ' + d.straggler.straggler_gpu : '--';
            svalEl.textContent = d.straggler.max_s_value.toFixed(3);
            leadEl.textContent = d.straggler.lead_gpu !== null ? 'GPU ' + d.straggler.lead_gpu : '--';
        }
    }

    function updateAgentChart() {
        if (!hwCharts.agent || agentEvents.length === 0) return;

        // Build Gantt-style segments from paired start/end events
        const segments = [];
        const starts = {};
        agentEvents.forEach(evt => {
            if (evt.type === 'llm_start' || evt.type === 'tool_start') {
                starts[evt.type.replace('_start', '')] = evt;
            } else if (evt.type === 'llm_end' || evt.type === 'tool_end') {
                const key = evt.type.replace('_end', '');
                if (starts[key]) {
                    segments.push({
                        start: starts[key].elapsed,
                        end: evt.elapsed,
                        type: key,
                        name: starts[key].name || key,
                    });
                    delete starts[key];
                }
            }
        });

        const data = segments.map(seg => ({
            value: [0, seg.start, seg.end, seg.end - seg.start],
            name: seg.name,
            itemStyle: { color: seg.type === 'llm' ? '#ff6b2b' : '#22d3ee' },
        }));

        function renderItem(params, api) {
            const start = api.coord([api.value(1), 0]);
            const end = api.coord([api.value(2), 0]);
            const height = api.size([0, 1])[1] * 0.6;
            return { type: 'rect', shape: { x: start[0], y: start[1] - height/2, width: Math.max(end[0] - start[0], 4), height: height }, style: api.style() };
        }

        const maxT = segments.length > 0 ? Math.max(...segments.map(s => s.end)) : 100;
        hwCharts.agent.setOption({
            tooltip: { formatter: p => p.data.name + '<br/>' + p.data.value[3].toFixed(1) + 's' },
            xAxis: { max: maxT },
            series: [{ type: 'custom', renderItem: renderItem, encode: { x: [1,2], y: 0 }, data: data }],
        });

        const tag = document.getElementById('hw-agent-tag');
        if (tag) tag.textContent = segments.length + ' events';
    }

    init();
    </script>
</body>
